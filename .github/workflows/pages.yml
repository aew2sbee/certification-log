# main に push されたら GitHub Pages に公開する。
# src/ の HTML / CSS / JS と、certs.json に書かれた資格フォルダ（記録データ）を同じ階層に並べて公開する。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 公開するファイルをまとめる
        run: |
          mkdir _site
          cp certs.json _site/
          for id in $(jq -r '.[]' certs.json); do
            cp -r "$id" _site/
          done
          cp -r src/. _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
